<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Monitor · Node Gateway</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root {
      --bg-start: #f0f9ff;
      --bg-end: #e0f2fe;
      --bg-accent: rgba(14, 165, 233, 0.12);
      --text: #0f172a;
      --muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(148, 163, 184, 0.25);
      --primary: #0ea5e9;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
      --green: #10b981;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-start: #0c1a2b;
        --bg-end: #0f172a;
        --bg-accent: rgba(14, 165, 233, 0.16);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --card-bg: rgba(15, 23, 42, 0.75);
        --card-border: rgba(148, 163, 184, 0.2);
        --primary: #38bdf8;
        --shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      line-height: 1.6; color: var(--text);
      background: radial-gradient(1200px 600px at 100% -50%, var(--bg-accent), transparent 60%), linear-gradient(135deg, var(--bg-start), var(--bg-end));
      background-attachment: fixed;
    }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px 80px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; margin: 0 0 8px; background: linear-gradient(45deg, var(--primary), #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status-bar { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .pill { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; color: var(--green); border: 1px solid rgba(16, 185, 129, 0.2); background: rgba(16, 185, 129, 0.1); display: inline-flex; align-items: center; gap: 6px; }
    .time-box { font-size: 12px; color: var(--muted); padding: 4px 12px; border-radius: 999px; background: rgba(148, 163, 184, 0.1); border: 1px solid var(--card-border); }
    .section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); padding: 22px; margin-bottom: 22px; }
    .section h2 { font-size: 16px; font-weight: 700; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    .section h2::before { content: ''; display: block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    .link { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.5); border: 1px solid var(--card-border); transition: all 0.2s; user-select: none; }
    @media (prefers-color-scheme: dark) { .link { background: rgba(255, 255, 255, 0.03); } }
    .link:hover { transform: scale(1.01); border-color: var(--primary); }
    .name { font-weight: 700; font-size: 15px; color: var(--primary); }
    .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ping { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ping.good { color: var(--green); }
    .ping.slow { color: #f59e0b; }
    .tag { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; color: #fff; display: inline-flex; align-items: center; gap: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 2s infinite; }
    .tag.main { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
    .tag.bk { background: #64748b; }
    .tag.mail { background: #8b5cf6; }
    .tag.tg { background: linear-gradient(135deg, #229ED9, #1e87bb); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; } }
    footer { margin-top: 36px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
    // 密文解密辅助函数（反向 Base64 解码）
    const D = s => {
      try { return decodeURIComponent(escape(atob(s.split('').reverse().join('')))); } catch (_) { return ''; }
    };

    // 🟢 页面全部中文标签与提示全密文打包（源码无明文）
    const RAW_PAYLOAD = "eyJuYW1lIjoi5rCU5rOh572R57ucIOKAキIOaPt+WFpeWvhumSpeS4juacjeWKoeWvvOiIqiIsInN1YiI6IuacjeWKoeWPr+eUqOaApyDwn5qoIOWkmuiKgueCueaOpeWFpeiwg+W6piIsInN0YXR1cyI6IuWFqOe6v+e9kee7nOacjeWKoeato+W4uCIsInNlYzEiOiLkuLvnur/mjqXlhaXoiYjngrkxIiwic2VjMiI6IuWfny9hLzLnp6vmuoDkuaDms7DpgILli7kiLCJlbWFpbFRpdGxlIjoi5Z+fL2Ev5LiT55So6YKu566xIiwic3ViRW1haWwiOiJxcGRpemhpQGF0b21pY21haWwuaW8iLCJjb3B5VGFnIjoi54K55Ye75aSN5Yi2Iiwibm90ZXMiOiLmj5DnpLrvvJrlu7rorq7kvb/nlKggQ3RybCArIEQg5bCG5pys6aG16Z2i5Yqg5YWl5Lmm562+44CCIn0=";

    // 🟢 节点数据配置（当前开启 Node 01 & 02，备用节点均预设在注释中）
    const NODES = [
      // 1. 主节点 (qqwwq.pages.dev)
      {
        name: '亚太极速专线 (Node 01)',
        desc: '推荐线路 · 智能优化加速',
        tag: '首选',
        tagClass: 'main',
        url: D('dmVkLnNlZ2FwLmloemlkcHEvLzpzcHR0aA==')
      },
      // 2. 备用节点 (qqwwq2.pages.dev)
      {
        name: '多线容灾节点 (Node 02)',
        desc: '低延迟线路 · 影音流畅',
        tag: '极速',
        tagClass: 'main',
        url: D('dmVkLnNlZ2FwLjJwc29hcGlxLy86c3B0dGg=')
      }

      /* 🟢 备用节点 03: Vercel 镜像节点 (部署好 Vercel 之后，删除本段注释符即可点亮) ->
      ,{
        name: 'Vercel 国际加速 (Node 03)',
        desc: '全球边缘 Anycast 容灾镜像',
        tag: '备用',
        tagClass: 'bk',
        url: D('cHAuMWxlY3Jldi5paHppZHBxLy86c3B0dGg=') // 填入你的 Vercel 域名倒序 Base64
      }
      */

      /* 🟢 备用节点 04: Netlify 镜像节点 (部署好 Netlify 之后，删除本段注释符即可点亮) ->
      ,{
        name: 'Netlify 智能容灾 (Node 04)',
        desc: '多线解析接入 · 自动分流',
        tag: '备用',
        tagClass: 'bk',
        url: D('cHAuMWV5ZmlsdGVuLmloemlkcHEvLzpzcHR0aA==') // 填入你的 Netlify 域名倒序 Base64
      }
      */

      /* 🟢 备用节点 05: GitHub Pages 镜像节点 (部署好 GitHub 后，删除本段注释符即可点亮) ->
      ,{
        name: 'GitHub 静态镜像 (Node 05)',
        desc: '海外纯净节点 · 最终故障兜底',
        tag: '兜底',
        tagClass: 'bk',
        url: D('b2kuYnVodGlnLmVtYW5ydW95Ly86c3B0dGg=') // 填入你的 GitHub 域名倒序 Base64
      }
      */
    ];

    (function renderApp() {
      const cfg = JSON.parse(atob(RAW_PAYLOAD));
      document.title = cfg.name;
      const today = new Intl.DateTimeFormat('zh-CN', { month:'long', day:'numeric' }).format(new Date());

      const app = document.getElementById('app');
      app.innerHTML = `
        <header>
          <h1>${cfg.name}</h1>
          <p style="color:var(--muted);font-size:14px;margin:0;">${cfg.sub}</p>
          <div class="status-bar">
            <span class="pill"><span class="dot" style="background:var(--green)"></span> ${cfg.status}</span>
            <span class="time-box">检测时间：${today}</span>
          </div>
        </header>

        <section class="section">
          <h2>${cfg.sec1}</h2>
          <div class="grid" id="nodeList"></div>
        </section>

        <section class="section">
          <h2>${cfg.sec2}</h2>
          <div class="grid" id="contactGrid">
            <!-- 邮箱找回卡片 -->
            <div class="link" id="mailBtn" role="button">
              <div>
                <div class="name">${cfg.emailTitle}</div>
                <div class="sub" id="mailText">${cfg.subEmail}</div>
              </div>
              <span class="tag mail">${cfg.copyTag}</span>
            </div>

            <!-- 🟢 Telegram 官方频道直达卡片 (准备好 TG 后，解除以下 8 行注释即可在前端点亮) -->
            <!--
            <div class="link" id="tgBtn" role="button">
              <div>
                <div class="name">Telegram 官方频道</div>
                <div class="sub">实时接收最新可用域名推送</div>
              </div>
              <span class="tag tg">立即加入</span>
            </div>
            -->
          </div>
        </section>

        <footer>
          <p>© ${new Date().getFullYear()} Network Operations Group. All Rights Reserved.</p>
          <div style="font-size:12.5px;color:var(--muted);margin-top:10px;">${cfg.notes}</div>
        </footer>
      `;

      // 渲染节点并执行测速
      const list = document.getElementById('nodeList');
      NODES.forEach((n, idx) => {
        const item = document.createElement('a');
        item.className = 'link';
        item.onclick = () => window.open(n.url, '_blank', 'noopener,noreferrer');
        item.innerHTML = `
          <div><div class="name">${n.name}</div><div class="sub">${n.desc}</div></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="ping" id="p-${idx}">测速中...</span>
            <span class="tag ${n.tagClass}"><span class="dot"></span>${n.tag}</span>
          </div>
        `;
        list.appendChild(item);

        const start = performance.now();
        const img = new Image();
        img.src = `${n.url}/favicon.ico?_t=${Date.now()}`;
        const done = () => {
          const ms = Math.round(performance.now() - start);
          const el = document.getElementById(`p-${idx}`);
          if (el) { el.textContent = ms + ' ms'; el.classList.add(ms < 300 ? 'good' : 'slow'); }
        };
        img.onload = done; img.onerror = done;
        setTimeout(done, 3500);
      });

      // 邮箱点击一键复制唤起
      document.getElementById('mailBtn').onclick = () => {
        navigator.clipboard.writeText(cfg.subEmail).then(() => {
          document.getElementById('mailText').textContent = '已复制，正在唤起邮箱...';
          setTimeout(() => { location.href = `mailto:${cfg.subEmail}`; }, 500);
        });
      };

      // Telegram 点击跳转事件（上面 HTML 注释解除后自动激活）
      const tgBtn = document.getElementById('tgBtn');
      if (tgBtn) {
        // 密文: https://t.me/stymei
        const safeTg = D('aWVtZXl0cy9lbS50Ly86c3B0dGg=');
        tgBtn.onclick = () => window.open(safeTg, '_blank', 'noopener,noreferrer');
      }
    })();
  </script>
</body>
</html>
